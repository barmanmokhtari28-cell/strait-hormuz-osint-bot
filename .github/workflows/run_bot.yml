name: Strait of Hormuz OSINT Bot

on:
  schedule:
    # Runs every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-osint-bot:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright & OS Dependencies
        run: |
          playwright install chromium --with-deps

      - name: Run OSINT Bot Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python bot.py

      - name: Save and Commit History State
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add history.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update vessel history baseline [skip ci]"
            git pull --rebase origin main || git pull --rebase origin master || true
            git push origin HEAD || true
          else
            echo "No history changes to commit."
          fi
